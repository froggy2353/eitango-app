<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>えいごであそぼ！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal-dark:   #0d7377;
    --teal:        #14a29a;
    --teal-light:  #32c8c0;
    --teal-pale:   #e0faf8;
    --accent:      #ff7043;
    --accent2:     #ffd54f;
    --correct:     #4caf50;
    --wrong:       #ef5350;
    --text:        #1a3c3b;
    --white:       #ffffff;
    --radius:      20px;
    --shadow:      0 4px 24px rgba(13,115,119,0.18);
  }

  html, body {
    height: 100%;
    font-family: 'Zen Maru Gothic', sans-serif;
    background: linear-gradient(160deg, #e0faf8 0%, #b2ebe7 100%);
    color: var(--text);
    overscroll-behavior: none;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; flex-direction: column; min-height: 100dvh; }
  .screen.active { display: flex; }

  /* ===== HOME ===== */
  #screen-home {
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px 20px;
  }
  .home-title {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(2.4rem, 10vw, 3.6rem);
    font-weight: 700;
    color: var(--teal-dark);
    text-align: center;
    line-height: 1.15;
  }
  .home-sub {
    font-size: 1rem;
    color: var(--teal);
    text-align: center;
  }
  .category-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    width: 100%;
    max-width: 400px;
  }
  .cat-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--white);
    border: 3px solid var(--teal-light);
    border-radius: var(--radius);
    padding: 18px 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-btn:active { transform: scale(0.95); box-shadow: none; }
  .cat-btn .emoji { font-size: 2.2rem; }
  .cat-btn .label {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: .85rem;
    font-weight: 700;
    color: var(--teal-dark);
  }

  /* ===== QUIZ ===== */
  #screen-quiz {
    flex-direction: column;
  }
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--teal);
    color: var(--white);
    padding: 12px 16px;
    gap: 10px;
  }
  .back-btn {
    background: rgba(255,255,255,.25);
    border: none;
    border-radius: 50%;
    width: 40px; height: 40px;
    font-size: 1.3rem;
    cursor: pointer;
    color: var(--white);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .quiz-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.3rem;
    font-weight: 600;
    flex: 1;
    text-align: center;
  }
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .progress-text { font-size: .85rem; min-width: 36px; text-align: right; }
  .progress-bar-bg {
    width: 60px; height: 8px;
    background: rgba(255,255,255,.3);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent2);
    border-radius: 99px;
    transition: width .4s;
  }

  .quiz-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px 24px;
    gap: 14px;
  }

  .question-label {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--teal-dark);
    text-align: center;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--white);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow);
    position: relative;
  }
  .card-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #e0f2f1;
  }
  .card-img-placeholder {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(135deg, #b2ebe7, #e0faf8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
  }

  .answer-panel {
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .answer-panel.hidden { display: none; }
  .word-en {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(2rem, 9vw, 3rem);
    font-weight: 700;
    color: var(--teal-dark);
    letter-spacing: .03em;
  }
  .word-ja {
    font-size: 1.1rem;
    color: var(--teal);
    font-weight: 700;
  }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 380px;
  }
  .btn {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 99px;
    padding: 14px 24px;
    cursor: pointer;
    transition: transform .15s, opacity .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.95); opacity: .85; }
  .btn-answer {
    background: var(--accent);
    color: var(--white);
    box-shadow: 0 4px 14px rgba(255,112,67,.4);
    flex: 1;
    min-width: 130px;
  }
  .btn-next {
    background: var(--teal);
    color: var(--white);
    box-shadow: 0 4px 14px rgba(20,162,154,.4);
    flex: 1;
    min-width: 130px;
  }
  .btn-mic {
    background: var(--teal-pale);
    color: var(--teal-dark);
    border: 3px solid var(--teal-light);
    flex: 1;
    min-width: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-mic.listening {
    background: var(--teal-light);
    color: var(--white);
    border-color: var(--teal);
    animation: pulse 1s infinite;
  }
  .btn-replay {
    background: var(--teal-pale);
    color: var(--teal-dark);
    border: 3px solid var(--teal-light);
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(50,200,192,.5); }
    50% { box-shadow: 0 0 0 10px rgba(50,200,192,0); }
  }

  /* ===== MIC RESULT ===== */
  .mic-result {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 1rem;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 99px;
    min-height: 40px;
  }
  .mic-result.correct { background: #e8f5e9; color: var(--correct); }
  .mic-result.wrong   { background: #ffebee; color: var(--wrong); }
  .mic-result.empty   { display: none; }

  /* ===== RESULT ===== */
  #screen-result {
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 32px 20px;
  }
  .result-emoji { font-size: 5rem; text-align: center; }
  .result-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--teal-dark);
    text-align: center;
  }
  .result-score {
    font-size: 1.2rem;
    color: var(--teal);
    font-weight: 700;
    text-align: center;
  }
  .stars { font-size: 2rem; letter-spacing: 4px; }
  .btn-home {
    background: var(--teal);
    color: var(--white);
    box-shadow: 0 4px 14px rgba(20,162,154,.4);
    font-size: 1.1rem;
    padding: 16px 36px;
  }

  /* ===== LOADING ===== */
  .img-loader {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #b2ebe7, #e0faf8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    transition: opacity .3s;
  }
  .img-loader.hidden { opacity: 0; pointer-events: none; }

  /* ===== NO MIC NOTICE ===== */
  .no-mic { display: none; font-size: .8rem; color: #999; text-align: center; }
  .no-mic.show { display: block; }
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="screen-home" class="screen active">
  <div>
    <div class="home-title">🌟 えいごで<br>あそぼ！</div>
    <div class="home-sub">カテゴリをえらんでね</div>
  </div>
  <div class="category-grid">
    <button class="cat-btn" data-cat="animals">
      <span class="emoji">🐘</span>
      <span class="label">どうぶつ</span>
    </button>
    <button class="cat-btn" data-cat="fruits">
      <span class="emoji">🍎</span>
      <span class="label">くだもの</span>
    </button>
    <button class="cat-btn" data-cat="colors">
      <span class="emoji">🌈</span>
      <span class="label">いろ</span>
    </button>
    <button class="cat-btn" data-cat="body">
      <span class="emoji">👀</span>
      <span class="label">からだ</span>
    </button>
    <button class="cat-btn" data-cat="food">
      <span class="emoji">🍱</span>
      <span class="label">たべもの</span>
    </button>
    <button class="cat-btn" data-cat="nature">
      <span class="emoji">🌸</span>
      <span class="label">しぜん</span>
    </button>
  </div>
</div>

<!-- ===== QUIZ ===== -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <button class="back-btn" id="back-btn">←</button>
    <div class="quiz-title" id="quiz-cat-title">どうぶつ</div>
    <div class="progress-wrap">
      <span class="progress-text" id="progress-text">1/8</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <div class="quiz-body">
    <div class="question-label" id="question-label">これはなにかな？</div>

    <div class="card" id="card">
      <div class="img-loader" id="img-loader">⏳</div>
      <img class="card-img" id="card-img" src="" alt="" loading="eager">
      <div class="answer-panel" id="answer-panel">
        <div class="word-en" id="word-en"></div>
        <div class="word-ja" id="word-ja"></div>
      </div>
    </div>

    <div class="mic-result empty" id="mic-result"></div>

    <div class="btn-row" id="btn-row-after">
      <button class="btn btn-replay" id="btn-replay">🔊 もういちど</button>
      <button class="btn btn-mic" id="btn-mic">🎤 はつおん</button>
      <button class="btn btn-next" id="btn-next">つぎへ →</button>
    </div>
    <div class="no-mic" id="no-mic">※このブラウザはマイクに対応していません</div>
  </div>
</div>

<!-- ===== RESULT ===== -->
<div id="screen-result" class="screen">
  <div class="result-emoji" id="result-emoji">🎉</div>
  <div class="result-title">すごい！おわったよ！</div>
  <div class="stars" id="result-stars">⭐⭐⭐</div>
  <div class="result-score" id="result-score"></div>
  <button class="btn btn-home" id="btn-home">ホームにもどる 🏠</button>
</div>

<script>
// ===== DATA =====
const CATEGORIES = {
  animals: {
    label: 'どうぶつ',
    words: [
      { en: 'Cat',      ja: 'ねこ',     img: 'photo-1514888286974-6c03e2ca1dba' },
      { en: 'Dog',      ja: 'いぬ',     img: 'photo-1587300003388-59208cc962cb' },
      { en: 'Elephant', ja: 'ぞう',     img: 'photo-1557050543-4d5f4e07ef46' },
      { en: 'Lion',     ja: 'らいおん', img: 'photo-1546182990-dffeafbe841d' },
      { en: 'Rabbit',   ja: 'うさぎ',   img: 'photo-1585110396000-c9ffd4e4b308' },
      { en: 'Panda',    ja: 'ぱんだ',   img: 'photo-1564349683136-77e08dba1ef7' },
      { en: 'Penguin',  ja: 'ぺんぎん', img: 'photo-1598439210625-5067c578f3f6' },
      { en: 'Giraffe',  ja: 'きりん',   img: 'photo-1547721064-da6cfb341d50' },
    ]
  },
  fruits: {
    label: 'くだもの',
    words: [
      { en: 'Apple',      ja: 'りんご',     img: 'photo-1568702846914-96b305d2aaeb' },
      { en: 'Banana',     ja: 'ばなな',     img: 'photo-1528825871115-3581a5387919' },
      { en: 'Strawberry', ja: 'いちご',     img: 'photo-1464965911861-746a04b4bca6' },
      { en: 'Watermelon', ja: 'すいか',     img: 'photo-1498557850523-fd3d118b962e' },
      { en: 'Orange',     ja: 'おれんじ',   img: 'photo-1547514701-42782101795e' },
      { en: 'Grapes',     ja: 'ぶどう',     img: 'photo-1537640538966-79f369143f8f' },
      { en: 'Peach',      ja: 'もも',       img: 'photo-1595743825637-cdafc8ad4173' },
      { en: 'Lemon',      ja: 'れもん',     img: 'photo-1582979512210-99b6a53386f9' },
    ]
  },
  colors: {
    label: 'いろ',
    words: [
      { en: 'Red',    ja: 'あか',   img: 'photo-1557672172-298e090bd0f1' },
      { en: 'Blue',   ja: 'あお',   img: 'photo-1557682250-33bd709cbe85' },
      { en: 'Yellow', ja: 'きいろ', img: 'photo-1551782450-a2132b4ba21d' },
      { en: 'Green',  ja: 'みどり', img: 'photo-1542601906897-2a9b0e6da53a' },
      { en: 'Pink',   ja: 'ぴんく', img: 'photo-1510906594845-bc082582c8cc' },
      { en: 'Orange', ja: 'おれんじ色', img: 'photo-1560717789-0ac7c58ac90a' },
      { en: 'Purple', ja: 'むらさき', img: 'photo-1558618666-fcd25c85cd64' },
      { en: 'White',  ja: 'しろ',   img: 'photo-1482961674540-0b0e8363a005' },
    ]
  },
  body: {
    label: 'からだ',
    words: [
      { en: 'Eye',   ja: 'め',   img: 'photo-1508559132751-858c5f413ce4' },
      { en: 'Nose',  ja: 'はな', img: 'photo-1536010305525-f7aa0834e2c7' },
      { en: 'Ear',   ja: 'みみ', img: 'photo-1631217868264-e5b90bb7e133' },
      { en: 'Hand',  ja: 'て',   img: 'photo-1601814933824-fd0b574dd592' },
      { en: 'Foot',  ja: 'あし', img: 'photo-1578874691223-64558a3ca096' },
      { en: 'Mouth', ja: 'くち', img: 'photo-1543332164-6e82f355badc' },
      { en: 'Hair',  ja: 'かみのけ', img: 'photo-1522337360788-8b13dee7a37e' },
    ]
  },
  food: {
    label: 'たべもの',
    words: [
      { en: 'Rice',     ja: 'ごはん',   img: 'photo-1516684732162-798a0062be99' },
      { en: 'Bread',    ja: 'ぱん',     img: 'photo-1549931319-a545dcf3bc7c' },
      { en: 'Pizza',    ja: 'ぴざ',     img: 'photo-1565299624946-b28f40a0ae38' },
      { en: 'Cake',     ja: 'けーき',   img: 'photo-1578985545062-69928b1d9587' },
      { en: 'Cookie',   ja: 'くっきー', img: 'photo-1499636136210-6f4ee915583e' },
      { en: 'Ice cream',ja: 'あいすくりーむ', img: 'photo-1497034825429-c343d7c6a68f' },
      { en: 'Egg',      ja: 'たまご',   img: 'photo-1518569656558-1f25e69d93d7' },
      { en: 'Milk',     ja: 'みるく',   img: 'photo-1550583724-b2692b85b150' },
    ]
  },
  nature: {
    label: 'しぜん',
    words: [
      { en: 'Sun',    ja: 'たいよう', img: 'photo-1508193638397-1c4234db14d8' },
      { en: 'Moon',   ja: 'つき',     img: 'photo-1532693322450-2cb5c511067d' },
      { en: 'Star',   ja: 'ほし',     img: 'photo-1464802686167-b939a6910659' },
      { en: 'Rain',   ja: 'あめ',     img: 'photo-1515694346937-94d85e41e6f0' },
      { en: 'Snow',   ja: 'ゆき',     img: 'photo-1491002052546-bf38f186af56' },
      { en: 'Flower', ja: 'はな',     img: 'photo-1490750967868-88df5691cc43' },
      { en: 'Tree',   ja: 'き',       img: 'photo-1542273917363-3b1817f69a2d' },
      { en: 'River',  ja: 'かわ',     img: 'photo-1504439904031-93ded9f93e4e' },
    ]
  }
};

// ===== STATE =====
let currentCat = null;
let words = [];
let index = 0;
let correctCount = 0;
let answered = false;
let recognition = null;
let isListening = false;

// ===== TTS =====
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  utter.pitch = 1.1;
  // iOS Safariはpausedになることがある
  if (window.speechSynthesis.paused) window.speechSynthesis.resume();
  window.speechSynthesis.speak(utter);
}

// ===== STT =====
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function initRecognition() {
  if (!SR) {
    document.getElementById('no-mic').classList.add('show');
    document.getElementById('btn-mic').style.display = 'none';
  }
}

function startRecognition() {
  if (!SR) return;
  // 毎回新しいインスタンスを作成（ブラウザ互換性のため）
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 5;

  recognition.onresult = (e) => {
    const results = Array.from(e.results[0]).map(r => r.transcript.trim().toLowerCase());
    const target = words[index].en.toLowerCase().replace(/\s+/g, ' ');
    const ok = results.some(r => r === target || r.replace(/\s+/g, '') === target.replace(/\s+/g, ''));
    showMicResult(ok, results[0]);
    isListening = false;
    document.getElementById('btn-mic').classList.remove('listening');
    document.getElementById('btn-mic').textContent = '🎤 はつおん';
    if (ok) correctCount++;
  };
  recognition.onerror = () => {
    isListening = false;
    document.getElementById('btn-mic').classList.remove('listening');
    document.getElementById('btn-mic').textContent = '🎤 はつおん';
    showMicResult(false, '（きこえなかったよ）');
  };
  recognition.onend = () => {
    if (isListening) {
      isListening = false;
      document.getElementById('btn-mic').classList.remove('listening');
      document.getElementById('btn-mic').textContent = '🎤 はつおん';
    }
  };

  isListening = true;
  document.getElementById('btn-mic').classList.add('listening');
  document.getElementById('btn-mic').innerHTML = '⏹ ていし';
  try { recognition.start(); } catch(e) {
    isListening = false;
    document.getElementById('btn-mic').classList.remove('listening');
    document.getElementById('btn-mic').textContent = '🎤 はつおん';
  }
}

function showMicResult(ok, heard) {
  const el = document.getElementById('mic-result');
  el.className = 'mic-result ' + (ok ? 'correct' : 'wrong');
  el.textContent = ok
    ? `⭕ すごい！ "${heard}" かんぺき！`
    : `❌ もういちど！ "${heard}"`;
}

// ===== NAVIGATION =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== START QUIZ =====
function startQuiz(cat) {
  currentCat = cat;
  const data = CATEGORIES[cat];
  words = shuffle([...data.words]);
  index = 0;
  correctCount = 0;
  document.getElementById('quiz-cat-title').textContent = data.label;
  showScreen('screen-quiz');
  loadCard();
  initRecognition();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ===== LOAD CARD =====
function loadCard() {
  answered = false;
  const word = words[index];

  // progress
  const total = words.length;
  document.getElementById('progress-text').textContent = `${index + 1}/${total}`;
  document.getElementById('progress-bar').style.width = `${(index / total) * 100}%`;

  // question label
  document.getElementById('question-label').textContent = 'これはなにかな？';

  // image
  const img = document.getElementById('card-img');
  const loader = document.getElementById('img-loader');
  loader.textContent = '⏳';
  loader.classList.remove('hidden');
  img.src = '';

  const url = `https://images.unsplash.com/${word.img}?w=480&q=80`;
  img.onload = () => loader.classList.add('hidden');
  img.onerror = () => { loader.textContent = '🖼️'; };
  img.src = url;
  img.alt = word.en;

  // answer panel — always visible
  document.getElementById('word-en').textContent = word.en;
  document.getElementById('word-ja').textContent = word.ja;

  // mic result
  const mr = document.getElementById('mic-result');
  mr.className = 'mic-result empty';
  mr.textContent = '';

  // buttons
  document.getElementById('btn-row-after').classList.remove('hidden');
  document.getElementById('btn-mic').classList.remove('listening');
  document.getElementById('btn-mic').innerHTML = '🎤 はつおん';

  // 自動読み上げ
  speak(word.en);
}

// ===== SHOW ANSWER =====
function showAnswer() {
  if (answered) return;
  answered = true;
  const word = words[index];
  document.getElementById('answer-panel').classList.remove('hidden');
  document.getElementById('word-en').textContent = word.en;
  document.getElementById('word-ja').textContent = word.ja;
  document.getElementById('question-label').textContent = `これは "${word.en}" だよ！`;
  document.getElementById('btn-row-before').classList.add('hidden');
  document.getElementById('btn-row-after').classList.remove('hidden');
  speak(word.en);
}

// ===== NEXT =====
function nextCard() {
  if (recognition && isListening) { recognition.stop(); isListening = false; }
  index++;
  if (index >= words.length) {
    showResult();
  } else {
    loadCard();
  }
}

// ===== RESULT =====
function showResult() {
  const total = words.length;
  const pct = correctCount / total;
  let emoji = '🌟';
  let stars = '⭐⭐⭐';
  if (pct < 0.4)  { emoji = '😊'; stars = '⭐'; }
  else if (pct < 0.75) { emoji = '🎊'; stars = '⭐⭐'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-stars').textContent = stars;
  document.getElementById('result-score').textContent =
    `はつおんチェック ${correctCount}/${total} もんせいかい！`;
  showScreen('screen-result');
}

// ===== EVENTS =====
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => startQuiz(btn.dataset.cat));
});

document.getElementById('back-btn').addEventListener('click', () => {
  if (recognition && isListening) { recognition.stop(); isListening = false; }
  window.speechSynthesis && window.speechSynthesis.cancel();
  showScreen('screen-home');
});

document.getElementById('btn-replay').addEventListener('click', () => {
  speak(words[index].en);
});

document.getElementById('btn-mic').addEventListener('click', () => {
  if (!SR) return;
  if (isListening) {
    recognition && recognition.stop();
    isListening = false;
    document.getElementById('btn-mic').classList.remove('listening');
    document.getElementById('btn-mic').innerHTML = '🎤 はつおん';
    return;
  }
  const mr = document.getElementById('mic-result');
  mr.className = 'mic-result empty';
  mr.textContent = '';
  startRecognition();
});

document.getElementById('btn-next').addEventListener('click', nextCard);
document.getElementById('btn-home').addEventListener('click', () => showScreen('screen-home'));

// prevent double-tap zoom
document.addEventListener('touchend', e => {
  if (e.target.tagName === 'BUTTON') e.preventDefault();
}, { passive: false });
</script>
</body>
</html>
