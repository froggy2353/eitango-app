<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>えいごであそぼ！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal-dark:   #0d7377;
    --teal:        #14a29a;
    --teal-light:  #32c8c0;
    --teal-pale:   #e0faf8;
    --accent:      #ff7043;
    --accent2:     #ffd54f;
    --correct:     #4caf50;
    --wrong:       #ef5350;
    --text:        #1a3c3b;
    --white:       #ffffff;
    --radius:      20px;
    --shadow:      0 4px 24px rgba(13,115,119,0.18);
  }

  html, body {
    height: 100%;
    font-family: 'Zen Maru Gothic', sans-serif;
    background: linear-gradient(160deg, #e0faf8 0%, #b2ebe7 100%);
    color: var(--text);
    overscroll-behavior: none;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; flex-direction: column; min-height: 100dvh; }
  .screen.active { display: flex; }

  /* ===== HOME ===== */
  #screen-home {
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px 20px;
  }
  .home-title {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(2.4rem, 10vw, 3.6rem);
    font-weight: 700;
    color: var(--teal-dark);
    text-align: center;
    line-height: 1.15;
  }
  .home-sub {
    font-size: 1rem;
    color: var(--teal);
    text-align: center;
  }
  .category-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    width: 100%;
    max-width: 400px;
  }
  .cat-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--white);
    border: 3px solid var(--teal-light);
    border-radius: var(--radius);
    padding: 18px 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-btn:active { transform: scale(0.95); box-shadow: none; }
  .cat-btn .emoji { font-size: 2.2rem; }
  .cat-btn .label {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: .85rem;
    font-weight: 700;
    color: var(--teal-dark);
  }

  /* ===== QUIZ ===== */
  #screen-quiz {
    flex-direction: column;
  }
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--teal);
    color: var(--white);
    padding: 12px 16px;
    gap: 10px;
  }
  .back-btn {
    background: rgba(255,255,255,.25);
    border: none;
    border-radius: 50%;
    width: 40px; height: 40px;
    font-size: 1.3rem;
    cursor: pointer;
    color: var(--white);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .quiz-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.3rem;
    font-weight: 600;
    flex: 1;
    text-align: center;
  }
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .progress-text { font-size: .85rem; min-width: 36px; text-align: right; }
  .progress-bar-bg {
    width: 60px; height: 8px;
    background: rgba(255,255,255,.3);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent2);
    border-radius: 99px;
    transition: width .4s;
  }

  .quiz-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px 24px;
    gap: 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .question-label {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--teal-dark);
    text-align: center;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--white);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow);
    position: relative;
  }
  .card-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 42dvh;
    object-fit: cover;
    display: block;
    background: #e0f2f1;
  }
  .card-img-placeholder {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(135deg, #b2ebe7, #e0faf8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
  }

  .answer-panel {
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .answer-panel.hidden { display: none; }
  .word-en {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(2rem, 9vw, 3rem);
    font-weight: 700;
    color: var(--teal-dark);
    letter-spacing: .03em;
  }
  .word-ja {
    font-size: 1.1rem;
    color: var(--teal);
    font-weight: 700;
  }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 380px;
  }
  .btn {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 99px;
    padding: 14px 24px;
    cursor: pointer;
    transition: transform .15s, opacity .15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(0.95); opacity: .85; }
  .btn-answer {
    background: var(--accent);
    color: var(--white);
    box-shadow: 0 4px 14px rgba(255,112,67,.4);
    flex: 1;
    min-width: 130px;
  }
  .btn-next {
    background: var(--teal);
    color: var(--white);
    box-shadow: 0 4px 14px rgba(20,162,154,.4);
    flex: 1;
    min-width: 130px;
  }
  .btn-mic {
    background: var(--teal-pale);
    color: var(--teal-dark);
    border: 3px solid var(--teal-light);
    flex: 1;
    min-width: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-mic.listening {
    background: var(--teal-light);
    color: var(--white);
    border-color: var(--teal);
    animation: pulse 1s infinite;
  }
  .btn-replay {
    background: var(--teal-pale);
    color: var(--teal-dark);
    border: 3px solid var(--teal-light);
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(50,200,192,.5); }
    50% { box-shadow: 0 0 0 10px rgba(50,200,192,0); }
  }

  /* ===== MIC RESULT ===== */
  .mic-result {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 1rem;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 99px;
    min-height: 40px;
  }
  .mic-result.correct { background: #e8f5e9; color: var(--correct); }
  .mic-result.wrong   { background: #ffebee; color: var(--wrong); }
  .mic-result.empty   { display: none; }

  /* ===== MIC MODAL ===== */
  .mic-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
  }
  .mic-modal-overlay.open {
    display: flex;
    animation: overlayIn 0.2s ease;
  }
  @keyframes overlayIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .mic-modal-card {
    background: #fff;
    border-radius: 28px 28px 0 0;
    padding: 20px 24px 44px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: relative;
    animation: sheetUp 0.32s cubic-bezier(.22,.68,0,1.2);
  }
  @keyframes sheetUp {
    from { transform: translateY(70px); opacity: 0.6; }
    to   { transform: translateY(0);    opacity: 1;   }
  }
  .mic-modal-handle {
    width: 44px; height: 5px;
    background: #ddd; border-radius: 3px;
    margin-bottom: 4px;
  }
  .mic-modal-close {
    position: absolute; top: 18px; right: 18px;
    width: 34px; height: 34px; border-radius: 50%;
    background: #f0f0f0; border: none;
    font-size: 1rem; color: #666; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .mic-modal-title {
    font-size: 0.9rem; color: #aaa; font-weight: 600;
    letter-spacing: 0.05em; margin: 0;
  }
  /* ===== LETTER BOXES (ELSA style) ===== */
  .letter-boxes {
    display: flex; gap: 6px; justify-content: center;
    flex-wrap: wrap; max-width: 100%; padding: 4px 0;
    perspective: 600px;
  }
  .letter-box {
    min-width: 42px; height: 52px; padding: 0 6px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.9rem; font-weight: 700;
    border: 3px solid #ddd; background: #f5f5f5; color: #c0c0c0;
  }
  .letter-box.ok {
    background: #e8f5e9; border-color: #4caf50; color: #2e7d32;
    animation: popBox 0.35s cubic-bezier(.17,.67,.46,1.5);
  }
  .letter-box.ng {
    background: #ffebee; border-color: #e53935; color: #c62828;
    animation: popBox 0.35s cubic-bezier(.17,.67,.46,1.5);
  }
  .letter-box.partial {
    background: #fff8e1; border-color: #ffb300; color: #e65100;
    animation: popBox 0.35s cubic-bezier(.17,.67,.46,1.5);
  }
  @keyframes popBox {
    0%   { transform: scale(1)    rotateX(0deg);   }
    30%  { transform: scale(0.8)  rotateX(-90deg); }
    60%  { transform: scale(1.15) rotateX(0deg);   }
    100% { transform: scale(1)    rotateX(0deg);   }
  }
  .kana-hint {
    font-size: 0.92rem; color: #bbb; font-weight: 600;
    letter-spacing: 0.08em; text-align: center; margin-top: -4px;
  }

  /* ===== SCORE ===== */
  .pronunciation-score {
    display: flex; align-items: baseline; gap: 3px;
    animation: scorePopIn 0.45s cubic-bezier(.17,.67,.46,1.5);
  }
  .score-number {
    font-family: 'Fredoka', sans-serif;
    font-size: 3.2rem; font-weight: 700; line-height: 1;
  }
  .score-unit { font-size: 1rem; font-weight: 700; color: #999; }
  .score-perfect { color: #4caf50; }
  .score-good    { color: #ff9800; }
  .score-try     { color: #e53935; }
  @keyframes scorePopIn {
    0%   { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }

  /* きいた言葉 */
  .heard-label {
    font-size: 0.88rem; color: #aaa; font-weight: 600;
    text-align: center; min-height: 1.3em; margin: 0;
  }

  /* waveform */
  .mic-waveform {
    display: flex; align-items: center; justify-content: center;
    gap: 5px; height: 52px;
  }
  .wave-bar {
    width: 5px; height: 44px; border-radius: 3px;
    background: var(--teal-light);
    transform: scaleY(0.12); transform-origin: center;
    transition: background 0.2s;
  }
  .mic-waveform.active .wave-bar {
    background: var(--teal);
    animation: soundwave var(--dur, 0.65s) ease-in-out infinite alternate;
  }
  .wave-bar:nth-child(1) { --dur: 0.50s; animation-delay: 0.00s; }
  .wave-bar:nth-child(2) { --dur: 0.70s; animation-delay: 0.09s; }
  .wave-bar:nth-child(3) { --dur: 0.44s; animation-delay: 0.18s; }
  .wave-bar:nth-child(4) { --dur: 0.76s; animation-delay: 0.04s; }
  .wave-bar:nth-child(5) { --dur: 0.57s; animation-delay: 0.14s; }
  .wave-bar:nth-child(6) { --dur: 0.63s; animation-delay: 0.22s; }
  .wave-bar:nth-child(7) { --dur: 0.41s; animation-delay: 0.07s; }
  @keyframes soundwave {
    from { transform: scaleY(0.12); }
    to   { transform: scaleY(1.0); }
  }

  .mic-status-text {
    font-size: 0.92rem; color: #999; font-weight: 600;
    text-align: center; margin: 0;
  }

  /* round mic button */
  .mic-round-btn {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--teal); color: #fff; border: none;
    font-size: 2.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 22px rgba(20,162,154,.45);
    transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .mic-round-btn:active { transform: scale(0.91); }
  .mic-round-btn.listening {
    background: #e53935;
    animation: pulseRed 1.2s infinite;
  }
  @keyframes pulseRed {
    0%  { box-shadow: 0 0 0 0   rgba(229,57,53,.55); }
    70% { box-shadow: 0 0 0 18px rgba(229,57,53,0); }
    100%{ box-shadow: 0 0 0 0   rgba(229,57,53,0); }
  }

  /* (mic-modal-result は letter-boxes + score に置き換え済み) */

  /* modal action buttons */
  .mic-modal-actions {
    display: none; flex-direction: row; gap: 12px;
    width: 100%; max-width: 320px;
  }
  .mic-modal-actions.show { display: flex; }
  .btn-retry {
    background: var(--teal-pale); color: var(--teal-dark);
    border: 3px solid var(--teal-light); flex: 1;
  }
  .btn-done {
    background: var(--teal); color: #fff;
    border: 3px solid var(--teal); flex: 1;
  }

  /* ===== RESULT ===== */
  #screen-result {
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 32px 20px;
  }
  .result-emoji { font-size: 5rem; text-align: center; }
  .result-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--teal-dark);
    text-align: center;
  }
  .result-score {
    font-size: 1.2rem;
    color: var(--teal);
    font-weight: 700;
    text-align: center;
  }
  .stars { font-size: 2rem; letter-spacing: 4px; }
  .btn-home {
    background: var(--teal);
    color: var(--white);
    box-shadow: 0 4px 14px rgba(20,162,154,.4);
    font-size: 1.1rem;
    padding: 16px 36px;
  }

  /* ===== LOADING ===== */
  .img-loader {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #b2ebe7, #e0faf8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    transition: opacity .3s;
  }
  .img-loader.hidden { opacity: 0; pointer-events: none; }

  /* ===== NO MIC NOTICE ===== */
  .no-mic { display: none; font-size: .8rem; color: #999; text-align: center; }
  .no-mic.show { display: block; }
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="screen-home" class="screen active">
  <div>
    <div class="home-title">🌟 えいごで<br>あそぼ！</div>
    <div class="home-sub">カテゴリをえらんでね</div>
  </div>
  <div class="category-grid">
    <button class="cat-btn" data-cat="animals">
      <span class="emoji">🐘</span>
      <span class="label">どうぶつ</span>
    </button>
    <button class="cat-btn" data-cat="fruits">
      <span class="emoji">🍎</span>
      <span class="label">くだもの</span>
    </button>
    <button class="cat-btn" data-cat="colors">
      <span class="emoji">🌈</span>
      <span class="label">いろ</span>
    </button>
    <button class="cat-btn" data-cat="body">
      <span class="emoji">👀</span>
      <span class="label">からだ</span>
    </button>
    <button class="cat-btn" data-cat="food">
      <span class="emoji">🍱</span>
      <span class="label">たべもの</span>
    </button>
    <button class="cat-btn" data-cat="nature">
      <span class="emoji">🌸</span>
      <span class="label">しぜん</span>
    </button>
  </div>
</div>

<!-- ===== QUIZ ===== -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <button class="back-btn" id="back-btn">←</button>
    <div class="quiz-title" id="quiz-cat-title">どうぶつ</div>
    <div class="progress-wrap">
      <span class="progress-text" id="progress-text">1/8</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <div class="quiz-body">
    <div class="question-label" id="question-label">これはなにかな？</div>

    <div class="card" id="card">
      <div class="img-loader" id="img-loader">⏳</div>
      <img class="card-img" id="card-img" src="" alt="" loading="eager">
      <div class="answer-panel" id="answer-panel">
        <div class="word-en" id="word-en"></div>
        <div class="word-ja" id="word-ja"></div>
      </div>
    </div>

    <div class="mic-result empty" id="mic-result"></div>

    <div class="btn-row" id="btn-row-after">
      <button class="btn btn-replay" id="btn-replay">🔊 もういちど</button>
      <button class="btn btn-mic" id="btn-mic">🎤 はつおん</button>
      <button class="btn btn-next" id="btn-next">つぎへ →</button>
    </div>
    <div class="no-mic" id="no-mic">※このブラウザはマイクに対応していません</div>
  </div>
</div>

<!-- ===== MIC MODAL ===== -->
<div id="mic-modal" class="mic-modal-overlay" aria-hidden="true">
  <div class="mic-modal-card">
    <div class="mic-modal-handle"></div>
    <button class="mic-modal-close" id="mic-modal-close" aria-label="とじる">✕</button>
    <p class="mic-modal-title">はつおん れんしゅう 🎤</p>

    <!-- ELSA スタイル: レターボックス -->
    <div class="letter-boxes" id="letter-boxes"></div>
    <p class="kana-hint" id="kana-hint"></p>

    <!-- スコア（結果後に表示） -->
    <div class="pronunciation-score" id="pronunciation-score" style="display:none">
      <span class="score-number" id="score-number">100</span><span class="score-unit">てん</span>
    </div>

    <!-- 波形 -->
    <div class="mic-waveform" id="mic-waveform">
      <span class="wave-bar"></span><span class="wave-bar"></span>
      <span class="wave-bar"></span><span class="wave-bar"></span>
      <span class="wave-bar"></span><span class="wave-bar"></span>
      <span class="wave-bar"></span>
    </div>
    <p class="mic-status-text" id="mic-status-text">マイクを おして はなしてね 🎙</p>
    <button class="mic-round-btn" id="mic-round-btn" aria-label="はつおん">🎤</button>

    <!-- きいた言葉 -->
    <p class="heard-label" id="heard-label"></p>

    <div class="mic-modal-actions" id="mic-modal-actions">
      <button class="btn btn-retry" id="mic-modal-retry">🔄 もういちど</button>
      <button class="btn btn-done" id="mic-modal-done">✕ とじる</button>
    </div>
  </div>
</div>

<!-- ===== RESULT ===== -->
<div id="screen-result" class="screen">
  <div class="result-emoji" id="result-emoji">🎉</div>
  <div class="result-title">すごい！おわったよ！</div>
  <div class="stars" id="result-stars">⭐⭐⭐</div>
  <div class="result-score" id="result-score"></div>
  <button class="btn btn-home" id="btn-home">ホームにもどる 🏠</button>
</div>

<script>
// ===== DATA =====
const CATEGORIES = {
  animals: {
    label: 'どうぶつ',
    words: [
      { en: 'Cat',      ja: 'ねこ',     img: 'photo-1514888286974-6c03e2ca1dba' },
      { en: 'Dog',      ja: 'いぬ',     img: 'photo-1587300003388-59208cc962cb' },
      { en: 'Elephant', ja: 'ぞう',     img: 'photo-1557050543-4d5f4e07ef46' },
      { en: 'Lion',     ja: 'らいおん', img: 'photo-1546182990-dffeafbe841d' },
      { en: 'Rabbit',   ja: 'うさぎ',   img: 'photo-1585110396000-c9ffd4e4b308' },
      { en: 'Panda',    ja: 'ぱんだ',   img: 'photo-1564349683136-77e08dba1ef7' },
      { en: 'Penguin',  ja: 'ぺんぎん', img: 'photo-1598439210625-5067c578f3f6' },
      { en: 'Giraffe',  ja: 'きりん',   img: 'photo-1547721064-da6cfb341d50' },
    ]
  },
  fruits: {
    label: 'くだもの',
    words: [

// ===== STATE =====
let currentCat = null;
let words = [];
let index = 0;
let correctCount = 0;
let answered = false;
let recognition = null;
let isListening = false;

// ===== TTS =====
function speak(text) {
  const synth = window.speechSynthesis;
  if (!synth) return;
  // 話し中のときだけキャンセル（iOS Safariはcancel()が状態を壊すことがある）
  if (synth.speaking) synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  utter.pitch = 1.1;
  // iOS Safari向けに英語ボイスを明示指定
  const voices = synth.getVoices();
  const enVoice = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en'));
  if (enVoice) utter.voice = enVoice;
  synth.speak(utter);
}

// ===== STT =====
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function initRecognition() {
  if (!SR) {
    document.getElementById('no-mic').classList.add('show');
    document.getElementById('btn-mic').style.display = 'none';
  }
}

// ===== PRONUNCIATION SCORING =====
// 編集距離ベースで各文字を ok / ng に分類
function scorePronunciation(target, heard) {
  const t = target.toLowerCase().replace(/\s+/g, '');
  const h = heard.toLowerCase().replace(/\s+/g, '');
  if (t === h) {
    return { score: 100, charResults: target.split('').map(c => c === ' ' ? 'space' : 'ok') };
  }
  // Wagner-Fischer DP
  const m = t.length, n = h.length;
  const dp = Array.from({length: m+1}, (_, i) =>
    Array.from({length: n+1}, (_, j) => i === 0 ? j : j === 0 ? i : 0));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = t[i-1] === h[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);

  // traceback → alignment for target chars
  const align = [];
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && t[i-1] === h[j-1]) {
      align.unshift('ok'); i--; j--;
    } else if (i > 0 && j > 0 && dp[i][j] === dp[i-1][j-1] + 1) {
      align.unshift('ng'); i--; j--;        // substitution
    } else if (j > 0 && dp[i][j] === dp[i][j-1] + 1) {
      j--;                                   // insertion in heard (skip)
    } else {
      align.unshift('ng'); i--;              // deletion
    }
  }
  const okCount = align.filter(r => r === 'ok').length;
  const score = Math.round((okCount / m) * 100);
  // spaces are always neutral
  let ci = 0;
  const charResults = target.split('').map(c => c === ' ' ? 'space' : (align[ci++] || 'ng'));
  return { score, charResults };
}

// レターボックスを描画（result なければグレー）
function renderLetterBoxes(word, charResults) {
  const container = document.getElementById('letter-boxes');
  container.innerHTML = word.split('').map((c, i) => {
    if (c === ' ') return '<div class="letter-box" style="min-width:10px;border:none;background:transparent"></div>';
    const cls = charResults ? charResults[i] || 'ng' : '';
    return `<div class="letter-box ${cls}">${c}</div>`;
  }).join('');
}

// スコアを表示しアニメーション
function showScore(score) {
  const el = document.getElementById('pronunciation-score');
  const num = document.getElementById('score-number');
  num.textContent = score;
  num.className = 'score-number ' +
    (score === 100 ? 'score-perfect' : score >= 70 ? 'score-good' : 'score-try');
  el.style.display = 'flex';
}

// ===== MIC MODAL =====
let micModalLastResult = null;
let micModalOpenTime   = 0;
let micStream          = null; // オーディオセッション維持用

async function openMicModal() {
  micModalOpenTime = Date.now();
  const word = words[index];
  renderLetterBoxes(word.en, null);
  document.getElementById('kana-hint').textContent = KANA_HINTS[word.en] || '';
  document.getElementById('pronunciation-score').style.display = 'none';
  document.getElementById('heard-label').textContent = '';
  document.getElementById('mic-modal-actions').classList.remove('show');
  micModalLastResult = null;
  setMicState('idle');
  document.getElementById('mic-modal').setAttribute('aria-hidden', 'false');
  document.getElementById('mic-modal').classList.add('open');
  // ゴーストクリック対策：モーダル表示直後500msはボタンを無効化
  const micBtn = document.getElementById('mic-round-btn');
  micBtn.style.pointerEvents = 'none';
  setTimeout(() => { micBtn.style.pointerEvents = ''; }, 500);
  // 「はつおん」ボタンのジェスチャー内でマイク権限を先取り
  // → マイクボタン押下時に recognition.start() を同期で呼べるようになる
  // ストリームを保持してオーディオセッションを生かし続ける
  // → 2回目以降の recognition.start() もすぐ使える
  try {
    if (!micStream) {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }
  } catch(e) {
    document.getElementById('mic-status-text').textContent = 'マイクを許可してね ⚠️';
  }
}

function closeMicModal() {
  document.getElementById('mic-modal').classList.remove('open');
  document.getElementById('mic-modal').setAttribute('aria-hidden', 'true');
  if (recognition && isListening) { try { recognition.stop(); } catch(e){} isListening = false; }
  setMicState('idle');
  // モーダルを閉じたらストリームを解放
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  // quiz本体のバッジに最終結果を反映
  if (micModalLastResult) {
    const el = document.getElementById('mic-result');
    const { ok, heard } = micModalLastResult;
    el.className = 'mic-result ' + (ok ? 'correct' : 'wrong');
    el.textContent = ok ? `⭕ "${heard}" かんぺき！` : `❌ "${heard}"`;
  }
}

function setMicState(state) {
  const waveEl   = document.getElementById('mic-waveform');
  const statusEl = document.getElementById('mic-status-text');
  const btnEl    = document.getElementById('mic-round-btn');
  if (state === 'listening') {
    waveEl.classList.add('active');
    statusEl.textContent = '👂 はなしてね...';
    btnEl.classList.add('listening');
    btnEl.innerHTML = '⏹';
  } else {
    waveEl.classList.remove('active');
    statusEl.textContent = state === 'processing'
      ? '⏳ かんがえてるよ...'
      : 'マイクを おして はなしてね 🎙';
    btnEl.classList.remove('listening');
    btnEl.innerHTML = '🎤';
    statusEl.textContent = 'マイクを おして はなしてね 🎙';
  }
}

function startMicModal() {
  if (!SR) return;
  if (isListening) { try { recognition && recognition.stop(); } catch(e){} isListening = false; }

  // iOS: TTSとSTTは同時使用不可 → 先にキャンセル
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}

  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 5;
  let gotResult = false;

  recognition.onresult = (e) => {
    if (gotResult) return;
    gotResult = true;
    try { recognition.stop(); } catch(e){}
    const results = Array.from(e.results[0]).map(r => r.transcript.trim().toLowerCase());
    const target = words[index].en.toLowerCase().replace(/\s+/g, ' ');
    const ok = results.some(r => r === target || r.replace(/\s+/g, '') === target.replace(/\s+/g, ''));
    isListening = false;
    setMicState('idle');
    if (ok) correctCount++;
    showMicModalResult(ok, results[0]);
  };
  recognition.onerror = (e) => {
    isListening = false;
    setMicState('idle');
    if (e.error === 'not-allowed') {
      document.getElementById('mic-status-text').textContent = 'マイクを許可してね ⚠️';
    }
  };
  recognition.onend = () => {
    if (isListening) {
      isListening = false;
      setMicState('idle');
    }
  };

  try {
    recognition.start();
    isListening = true;
    gotResult = false;
    setMicState('listening');
  } catch(e) {
    isListening = false;
    setMicState('idle');
  }
}

function showMicModalResult(ok, heard) {
  micModalLastResult = { ok, heard };
  const target = words[index].en;
  const { score, charResults } = scorePronunciation(target, heard);
  const actionsEl = document.getElementById('mic-modal-actions');

  // レターボックスをスコア別に1文字ずつ遅延で色をつける（ELSAスタイル）
  renderLetterBoxes(target, null); // まずグレーで再描画
  const boxes = document.querySelectorAll('#letter-boxes .letter-box');
  let bi = 0;
  target.split('').forEach((c, i) => {
    if (c === ' ') return;
    const box = boxes[i];
    if (!box) return;
    const delay = bi * 110;
    bi++;
    setTimeout(() => { box.classList.add(charResults[i] || 'ng'); }, delay);
  });

  // スコアは全ボックス開示後に表示
  const totalDelay = (bi - 1) * 110 + 400;
  setTimeout(() => showScore(score), totalDelay);

  // きいた言葉
  document.getElementById('heard-label').textContent =
    heard === 'きこえなかったよ' ? '（きこえなかったよ）' : `「${heard}」と きこえたよ`;

  actionsEl.classList.add('show');

  // 100点なら2.5秒後に自動クローズ
  if (score === 100) {
    setTimeout(() => {
      if (document.getElementById('mic-modal').classList.contains('open')) closeMicModal();
    }, totalDelay + 1800);
  }
}

// ===== NAVIGATION =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== START QUIZ =====
function startQuiz(cat) {
  currentCat = cat;
  const data = CATEGORIES[cat];
  words = shuffle([...data.words]);
  index = 0;
  correctCount = 0;
  document.getElementById('quiz-cat-title').textContent = data.label;
  showScreen('screen-quiz');
  loadCard();
  initRecognition();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ===== LOAD CARD =====
function loadCard() {
  answered = false;
  const word = words[index];

  // progress
  const total = words.length;
  document.getElementById('progress-text').textContent = `${index + 1}/${total}`;
  document.getElementById('progress-bar').style.width = `${(index / total) * 100}%`;

  // question label
  document.getElementById('question-label').textContent = 'これはなにかな？';

  // image
  const img = document.getElementById('card-img');
  const loader = document.getElementById('img-loader');
  loader.textContent = '⏳';
  loader.classList.remove('hidden');
  img.src = '';

  const url = `https://images.unsplash.com/${word.img}?w=480&q=80`;
  img.onload = () => loader.classList.add('hidden');
  img.onerror = () => { loader.textContent = '🖼️'; };
  img.src = url;
  img.alt = word.en;

  // answer panel — always visible
  document.getElementById('word-en').textContent = word.en;
  document.getElementById('word-ja').textContent = word.ja;

  // mic result
  const mr = document.getElementById('mic-result');
  mr.className = 'mic-result empty';
  mr.textContent = '';

  // buttons
  document.getElementById('btn-row-after').classList.remove('hidden');
  // モーダルが開いていれば閉じる
  if (document.getElementById('mic-modal').classList.contains('open')) closeMicModal();

  // 自動読み上げ
  speak(word.en);
}

// ===== SHOW ANSWER =====
function showAnswer() {
  if (answered) return;
  answered = true;
  const word = words[index];
  document.getElementById('answer-panel').classList.remove('hidden');
  document.getElementById('word-en').textContent = word.en;
  document.getElementById('word-ja').textContent = word.ja;
  document.getElementById('question-label').textContent = `これは "${word.en}" だよ！`;
  document.getElementById('btn-row-before').classList.add('hidden');
  document.getElementById('btn-row-after').classList.remove('hidden');
  speak(word.en);
}

// ===== NEXT =====
function nextCard() {
  if (recognition && isListening) { recognition.stop(); isListening = false; }
  index++;
  if (index >= words.length) {
    showResult();
  } else {
    loadCard();
  }
}

// ===== RESULT =====
function showResult() {
  const total = words.length;
  const pct = correctCount / total;
  let emoji = '🌟';
  let stars = '⭐⭐⭐';
  if (pct < 0.4)  { emoji = '😊'; stars = '⭐'; }
  else if (pct < 0.75) { emoji = '🎊'; stars = '⭐⭐'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-stars').textContent = stars;
  document.getElementById('result-score').textContent =
    `はつおんチェック ${correctCount}/${total} もんせいかい！`;
  showScreen('screen-result');
}

// ===== EVENTS =====
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => startQuiz(btn.dataset.cat));
});

document.getElementById('back-btn').addEventListener('click', () => {
  if (recognition && isListening) { recognition.stop(); isListening = false; }
  window.speechSynthesis && window.speechSynthesis.cancel();
  showScreen('screen-home');
});

document.getElementById('btn-replay').addEventListener('click', () => {
  speak(words[index].en);
});

// はつおんボタン → モーダルを開くだけ（録音はラウンドボタンで開始）
document.getElementById('btn-mic').addEventListener('click', () => {
  if (!SR) return;
  openMicModal();
});

// モーダル内ボタン
document.getElementById('mic-modal-close').addEventListener('click', closeMicModal);
document.getElementById('mic-modal-done').addEventListener('click', closeMicModal);
document.getElementById('mic-modal-retry').addEventListener('click', () => {
  renderLetterBoxes(words[index].en, null);
  document.getElementById('pronunciation-score').style.display = 'none';
  document.getElementById('heard-label').textContent = '';
  document.getElementById('mic-modal-actions').classList.remove('show');
  micModalLastResult = null;
  setMicState('idle');
});

// ラウンドボタン：タップでON/OFF（発話が終われば自動停止）
// click を使用（iOS Speech API はユーザージェスチャーとして click が必要）
// ゴーストクリックは openMicModal() の pointer-events:none で防ぐ
document.getElementById('mic-round-btn').addEventListener('click', () => {
  if (isListening) {
    try { recognition && recognition.stop(); } catch(e){}
  } else {
    startMicModal();
  }
});

document.getElementById('btn-next').addEventListener('click', nextCard);
document.getElementById('btn-home').addEventListener('click', () => showScreen('screen-home'));
