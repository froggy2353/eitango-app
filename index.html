<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>えいごであそぼ！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal-dark:   #0d7377;
    --teal:        #14a29a;
    --teal-light:  #32c8c0;
    --teal-pale:   #e0faf8;
    --accent:      #ff7043;
    --accent2:     #ffd54f;
    --correct:     #4caf50;
    --wrong:       #ef5350;
    --text:        #1a3c3b;
    --white:       #ffffff;
    --radius:      20px;
    --shadow:      0 4px 24px rgba(13,115,119,0.18);
  }

  html, body {
    height: 100%;
    font-family: 'Zen Maru Gothic', sans-serif;
    background: linear-gradient(160deg, #e0faf8 0%, #b2ebe7 100%);
    color: var(--text);
    overscroll-behavior: none;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; flex-direction: column; min-height: 100dvh; }
  .screen.active { display: flex; }

  /* ===== HOME ===== */
  #screen-home {
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px 20px;
  }
  .home-title {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(2.4rem, 10vw, 3.6rem);
    font-weight: 700;
    color: var(--teal-dark);
    text-align: center;
    line-height: 1.15;
  }
  .home-sub {
    font-size: 1rem;
    color: var(--teal);
    text-align: center;
  }
  .category-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    width: 100%;
    max-width: 400px;
  }
  .cat-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--white);
    border: 3px solid var(--teal-light);
    border-radius: var(--radius);
    padding: 18px 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-btn:active { transform: scale(0.95); box-shadow: none; }
  .cat-btn .emoji { font-size: 2.2rem; }
  .cat-btn .label {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: .85rem;
    font-weight: 700;
    color: var(--teal-dark);
  }

  /* ===== QUIZ ===== */
  #screen-quiz {
    flex-direction: column;
  }
  .quiz-header {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    background: transparent;
    padding: 12px 16px 8px;
    gap: 8px;
  }
  .back-btn {
    background: none;
    border: none;
    border-radius: 50%;
    width: 40px; height: 40px;
    font-size: 1.3rem;
    cursor: pointer;
    color: var(--teal-dark);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .quiz-title { display: none; }
  .progress-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .progress-text {
    font-size: .9rem;
    font-weight: 700;
    color: var(--teal-dark);
    text-align: center;
  }
  .progress-bar-bg {
    width: 100%; height: 8px;
    background: rgba(0,0,0,.1);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 99px;
    transition: width .4s;
  }

  .quiz-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px 24px;
    gap: 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .question-label {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--teal-dark);
    text-align: center;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--white);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow);
    position: relative;
  }
  .card-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 42dvh;
    object-fit: cover;
    display: block;
    background: #e0f2f1;
  }
  .card-img-placeholder {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(135deg, #b2ebe7, #e0faf8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
  }

  .answer-panel {
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .answer-panel.hidden { display: none; }
  .word-en {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(2rem, 9vw, 3rem);
    font-weight: 700;
    color: var(--teal-dark);
    letter-spacing: .03em;
  }
  .word-ja {
    display: none;
  }

  .btn-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    width: 100%;
    max-width: 380px;
  }
  .btn {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 99px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s, opacity .15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(0.95); opacity: .85; }
  .btn-answer {
    background: var(--accent);
    color: var(--white);
    box-shadow: 0 4px 14px rgba(255,112,67,.4);
    width: 64px; height: 64px;
  }
  .btn-next {
    background: var(--teal);
    color: var(--white);
    box-shadow: 0 6px 20px rgba(20,162,154,.45);
    width: 84px; height: 84px;
  }
  .btn-mic {
    background: var(--white);
    color: #555;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
    width: 58px; height: 58px;
  }
  .btn-mic.listening {
    background: var(--teal-light);
    color: var(--white);
    box-shadow: 0 0 0 0 rgba(50,200,192,.5);
    animation: pulse 1s infinite;
  }
  .btn-replay {
    background: var(--white);
    color: #e85d3d;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
    width: 58px; height: 58px;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(50,200,192,.5); }
    50% { box-shadow: 0 0 0 10px rgba(50,200,192,0); }
  }

  /* ===== MIC RESULT ===== */
  .mic-result {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 1rem;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 99px;
    min-height: 40px;
  }
  .mic-result.correct { background: #e8f5e9; color: var(--correct); }
  .mic-result.wrong   { background: #ffebee; color: var(--wrong); }
  .mic-result.empty   { display: none; }

  /* ===== MIC MODAL ===== */
  .mic-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
  }
  .mic-modal-overlay.open {
    display: flex;
    animation: overlayIn 0.2s ease;
  }
  @keyframes overlayIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .mic-modal-card {
    background: #fff;
    border-radius: 28px 28px 0 0;
    padding: 20px 24px 44px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: relative;
    animation: sheetUp 0.32s cubic-bezier(.22,.68,0,1.2);
  }
  @keyframes sheetUp {
    from { transform: translateY(70px); opacity: 0.6; }
    to   { transform: translateY(0);    opacity: 1;   }
  }
  .mic-modal-handle {
    width: 44px; height: 5px;
    background: #ddd; border-radius: 3px;
    margin-bottom: 4px;
  }
  .mic-modal-close {
    position: absolute; top: 18px; right: 18px;
    width: 34px; height: 34px; border-radius: 50%;
    background: #f0f0f0; border: none;
    font-size: 1rem; color: #666; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .mic-modal-title {
    font-size: 0.9rem; color: #aaa; font-weight: 600;
    letter-spacing: 0.05em; margin: 0;
  }
  /* ===== LETTER BOXES (ELSA style) ===== */
  .letter-boxes {
    display: flex; gap: 6px; justify-content: center;
    flex-wrap: wrap; max-width: 100%; padding: 4px 0;
    perspective: 600px;
  }
  .letter-box {
    min-width: 42px; height: 52px; padding: 0 6px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.9rem; font-weight: 700;
    border: 3px solid #ddd; background: #f5f5f5; color: #c0c0c0;
  }
  .letter-box.ok {
    background: #e8f5e9; border-color: #4caf50; color: #2e7d32;
    animation: popBox 0.35s cubic-bezier(.17,.67,.46,1.5);
  }
  .letter-box.ng {
    background: #ffebee; border-color: #e53935; color: #c62828;
    animation: popBox 0.35s cubic-bezier(.17,.67,.46,1.5);
  }
  .letter-box.partial {
    background: #fff8e1; border-color: #ffb300; color: #e65100;
    animation: popBox 0.35s cubic-bezier(.17,.67,.46,1.5);
  }
  @keyframes popBox {
    0%   { transform: scale(1)    rotateX(0deg);   }
    30%  { transform: scale(0.8)  rotateX(-90deg); }
    60%  { transform: scale(1.15) rotateX(0deg);   }
    100% { transform: scale(1)    rotateX(0deg);   }
  }
  .kana-hint {
    font-size: 0.92rem; color: #bbb; font-weight: 600;
    letter-spacing: 0.08em; text-align: center; margin-top: -4px;
  }

  /* ===== SCORE ===== */
  .pronunciation-score {
    display: flex; align-items: baseline; gap: 3px;
    animation: scorePopIn 0.45s cubic-bezier(.17,.67,.46,1.5);
  }
  .score-number {
    font-family: 'Fredoka', sans-serif;
    font-size: 3.2rem; font-weight: 700; line-height: 1;
  }
  .score-unit { font-size: 1rem; font-weight: 700; color: #999; }
  .score-perfect { color: #4caf50; }
  .score-good    { color: #ff9800; }
  .score-try     { color: #e53935; }
  @keyframes scorePopIn {
    0%   { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }

  /* きいた言葉 */
  .heard-label {
    font-size: 0.88rem; color: #aaa; font-weight: 600;
    text-align: center; min-height: 1.3em; margin: 0;
  }

  /* waveform */
  .mic-waveform {
    display: flex; align-items: center; justify-content: center;
    gap: 5px; height: 52px;
  }
  .wave-bar {
    width: 5px; height: 44px; border-radius: 3px;
    background: var(--teal-light);
    transform: scaleY(0.12); transform-origin: center;
    transition: background 0.2s;
  }
  .mic-waveform.active .wave-bar {
    background: var(--teal);
    animation: soundwave var(--dur, 0.65s) ease-in-out infinite alternate;
  }
  .wave-bar:nth-child(1) { --dur: 0.50s; animation-delay: 0.00s; }
  .wave-bar:nth-child(2) { --dur: 0.70s; animation-delay: 0.09s; }
  .wave-bar:nth-child(3) { --dur: 0.44s; animation-delay: 0.18s; }
  .wave-bar:nth-child(4) { --dur: 0.76s; animation-delay: 0.04s; }
  .wave-bar:nth-child(5) { --dur: 0.57s; animation-delay: 0.14s; }
  .wave-bar:nth-child(6) { --dur: 0.63s; animation-delay: 0.22s; }
  .wave-bar:nth-child(7) { --dur: 0.41s; animation-delay: 0.07s; }
  @keyframes soundwave {
    from { transform: scaleY(0.12); }
    to   { transform: scaleY(1.0); }
  }

  .mic-status-text {
    font-size: 0.92rem; color: #999; font-weight: 600;
    text-align: center; margin: 0;
  }

  /* round mic button */
  .mic-round-btn {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--teal); color: #fff; border: none;
    font-size: 2.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 22px rgba(20,162,154,.45);
    transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .mic-round-btn:active { transform: scale(0.91); }
  .mic-round-btn.listening {
    background: #e53935;
    animation: pulseRed 1.2s infinite;
  }
  @keyframes pulseRed {
    0%  { box-shadow: 0 0 0 0   rgba(229,57,53,.55); }
    70% { box-shadow: 0 0 0 18px rgba(229,57,53,0); }
    100%{ box-shadow: 0 0 0 0   rgba(229,57,53,0); }
  }

  /* (mic-modal-result は letter-boxes + score に置き換え済み) */

  /* modal action buttons */
  .mic-modal-actions {
    display: none; flex-direction: row; gap: 12px;
    width: 100%; max-width: 320px;
  }
  .mic-modal-actions.show { display: flex; }
  .btn-retry {
    background: var(--teal-pale); color: var(--teal-dark);
    border: 3px solid var(--teal-light); flex: 1;
  }
  .btn-done {
    background: var(--teal); color: #fff;
    border: 3px solid var(--teal); flex: 1;
  }

  /* ===== IPA 発音記号比較 ===== */
  .ipa-compare {
    width: 100%; max-width: 320px;
    background: #f7f7f7; border-radius: 14px;
    padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
    margin: 2px 0 6px;
  }
  .ipa-row {
    display: flex; align-items: center; gap: 6px;
  }
  .ipa-label {
    font-size: 0.7rem; font-weight: 700; color: #888;
    min-width: 40px; text-align: right; flex-shrink: 0;
  }
  .ipa-cells {
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .ipa-cell {
    font-size: 0.95rem; font-weight: 600; font-family: serif;
    background: #fff; border: 2px solid #ddd;
    border-radius: 8px; padding: 2px 6px;
    min-width: 28px; text-align: center; color: #555;
  }
  .ipa-cell.ok      { border-color: #4caf50; color: #2e7d32; background: #e8f5e9; }
  .ipa-cell.partial { border-color: #ffb300; color: #e65100; background: #fff8e1; }
  .ipa-cell.ng      { border-color: #e53935; color: #c62828; background: #ffebee; }
  .ipa-cell { cursor: pointer; }
  .ipa-cell:active { opacity: 0.65; }

  /* 発音ヒントボックス */
  .hint-box {
    font-size: 0.83rem; color: #444; text-align: center;
    padding: 8px 12px; background: #f0faf9; border-radius: 12px;
    border: 1.5px solid #b2ebe7;
    width: 100%; max-width: 320px;
    display: none; line-height: 1.5;
  }
  .hint-box.show { display: block; }

  /* ===== 聴き比べボタン ===== */
  .compare-btns {
    display: flex; align-items: center; gap: 0;
    background: #f4f4f4; border-radius: 18px;
    padding: 6px; width: 100%; max-width: 280px;
    margin: 4px 0 8px;
  }
  .btn-compare {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 10px 8px;
    background: transparent; border: none; border-radius: 14px;
    cursor: pointer; transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-compare:active { background: #e0e0e0; }
  .btn-compare.playing {
    background: var(--teal); box-shadow: 0 2px 8px rgba(0,163,150,.35);
  }
  .btn-compare.playing .compare-icon,
  .btn-compare.playing .compare-label { color: #fff; }
  .compare-icon { font-size: 1.6rem; line-height: 1; }
  .compare-label {
    font-size: 0.72rem; font-weight: 700;
    color: #555; letter-spacing: 0.02em;
  }
  .compare-divider {
    width: 1px; height: 36px; background: #ddd; flex-shrink: 0;
  }

  /* ===== RESULT ===== */
  #screen-result {
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 32px 20px;
  }
  .result-emoji { font-size: 5rem; text-align: center; }
  .result-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--teal-dark);
    text-align: center;
  }
  .result-score {
    font-size: 1.2rem;
    color: var(--teal);
    font-weight: 700;
    text-align: center;
  }
  .stars { font-size: 2rem; letter-spacing: 4px; }
  .btn-home {
    background: var(--teal);
    color: var(--white);
    box-shadow: 0 4px 14px rgba(20,162,154,.4);
    font-size: 1.1rem;
    padding: 16px 36px;
  }

  /* ===== LOADING ===== */
  .img-loader {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #b2ebe7, #e0faf8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    transition: opacity .3s;
  }
  .img-loader.hidden { opacity: 0; pointer-events: none; }

  /* ===== NO MIC NOTICE ===== */
  .no-mic { display: none; font-size: .8rem; color: #999; text-align: center; }
  .no-mic.show { display: block; }
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="screen-home" class="screen active">
  <div>
    <div class="home-title">🌟 えいごで<br>あそぼ！</div>
    <div class="home-sub">カテゴリをえらんでね</div>
  </div>
  <div class="category-grid">
    <button class="cat-btn" data-cat="animals">
      <span class="emoji">🐘</span>
      <span class="label">どうぶつ</span>
    </button>
    <button class="cat-btn" data-cat="fruits">
      <span class="emoji">🍎</span>
      <span class="label">くだもの</span>
    </button>
    <button class="cat-btn" data-cat="colors">
      <span class="emoji">🌈</span>
      <span class="label">いろ</span>
    </button>
    <button class="cat-btn" data-cat="body">
      <span class="emoji">👀</span>
      <span class="label">からだ</span>
    </button>
    <button class="cat-btn" data-cat="food">
      <span class="emoji">🍱</span>
      <span class="label">たべもの</span>
    </button>
    <button class="cat-btn" data-cat="nature">
      <span class="emoji">🌸</span>
      <span class="label">しぜん</span>
    </button>
  </div>
</div>

<!-- ===== QUIZ ===== -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <button class="back-btn" id="back-btn">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="progress-wrap">
      <span class="progress-text" id="progress-text">1/8</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
      </div>
    </div>
    <button class="back-btn" id="settings-btn" style="color:var(--teal-dark)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="8" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="8" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>

  <div class="quiz-body">
    <div class="card" id="card">
      <div class="img-loader" id="img-loader">⏳</div>
      <img class="card-img" id="card-img" src="" alt="" loading="eager">
      <div class="answer-panel" id="answer-panel">
        <div class="word-en" id="word-en"></div>
        <div class="word-ja" id="word-ja"></div>
      </div>
    </div>

    <div class="mic-result empty" id="mic-result"></div>

    <div class="btn-row" id="btn-row-after">

// ===== CTC 強制アラインメント =====
// logitsFlat: Float32Array [T*V], T=時間, V=語彙数
// targetIds: number[] 目標トークンID列
// 戻り値: 文字ごとの平均 log確率
function ctcForcedAlign(logitsFlat, T, V, targetIds, blankId) {
  const S = targetIds.length;
  const NEG_INF = -1e10;

  // log softmax を時間ステップごとに適用
  const lsp = new Float64Array(logitsFlat.length);
  for (let t = 0; t < T; t++) {
    const off = t * V;
    let mx = -Infinity;
    for (let v = 0; v < V; v++) if (logitsFlat[off + v] > mx) mx = logitsFlat[off + v];
    let sum = 0;
    for (let v = 0; v < V; v++) sum += Math.exp(logitsFlat[off + v] - mx);
    const logSum = mx + Math.log(sum);
    for (let v = 0; v < V; v++) lsp[off + v] = logitsFlat[off + v] - logSum;
  }

  // 前向き DP: alphaTable[t][s] = t フレームで s 文字アラインした際の最良累積 log確率
  const alphaTable = Array.from({ length: T + 1 }, () => new Float64Array(S + 1).fill(NEG_INF));
  alphaTable[0][0] = 0.0;
  for (let t = 1; t <= T; t++) {
    const off = (t - 1) * V;
    for (let s = 0; s <= S; s++) {
      const prev = alphaTable[t - 1][s];
      if (prev <= NEG_INF) continue;
      // blank を出力 → 同じ s に留まる
      const bs = prev + lsp[off + blankId];
      if (bs > alphaTable[t][s]) alphaTable[t][s] = bs;
      // 文字 s を出力 → s+1 に進む
      if (s < S) {
        const cs = prev + lsp[off + targetIds[s]];
        if (cs > alphaTable[t][s + 1]) alphaTable[t][s + 1] = cs;
      }
    }
  }

  // 後ろ向きトレースバック: 各文字の遷移フレームを特定
  const charLPs = Array.from({ length: S }, () => []);
  const charTransFrames = new Array(S).fill(-1); // 各文字が遷移したフレーム番号
  let s = S;
  for (let t = T; t >= 1 && s > 0; t--) {
    const off = (t - 1) * V;
    const via_char = alphaTable[t - 1][s - 1] + lsp[off + targetIds[s - 1]];
    const via_blank = alphaTable[t - 1][s] + lsp[off + blankId];
    if (via_char >= via_blank && alphaTable[t - 1][s - 1] > NEG_INF) {
      charLPs[s - 1].push(lsp[off + targetIds[s - 1]]);
      charTransFrames[s - 1] = t - 1; // 0-indexed
      s--;
    }
  }

  // 各文字の遷移フレームから非重複区間を定義して最多argmaxを集計
  // 区間: [前文字の遷移フレーム+1, 自分の遷移フレーム] (重複なし)
  const charBestIds = charTransFrames.map((tf, si) => {
    if (tf < 0) return -1;
    const lo = si === 0 ? 0 : (charTransFrames[si - 1] >= 0 ? charTransFrames[si - 1] + 1 : 0);
    const hi = tf;
    if (lo > hi) return -1;
    const votes = new Float64Array(V);
    for (let t2 = lo; t2 <= hi; t2++) {
      const off = t2 * V;
      let bestV = 0;
      for (let v = 1; v < V; v++) if (lsp[off + v] > lsp[off + bestV]) bestV = v;
      if (bestV !== blankId) votes[bestV]++;
    }
    let best = -1, bestCount = 0;
    for (let v = 0; v < V; v++) if (votes[v] > bestCount) { bestCount = votes[v]; best = v; }
    return best;
  });

  return {
    lps: charLPs.map(lps => lps.length > 0 ? lps.reduce((a, b) => a + b) / lps.length : -10),
    charBestIds,
  };
}

// log確率 [-4, 0] → スコア [0, 100]
function lpToScore(lp) {
  // [-10, 0] → [0, 100] に拡張: digraphや非母語話者でも適切なスコアが出るように
  return Math.max(0, Math.min(100, Math.round((lp + 10) / 10 * 100)));
}

// 音声 Blob → 16kHz Float32Array（mono）
async function blobToFloat32(blob) {
  const buf = await blob.arrayBuffer();
  // まずネイティブのサンプルレートでデコード
  const ctx = new AudioContext();
  let ab;
  try {
    ab = await ctx.decodeAudioData(buf);
  } finally {
    ctx.close();
  }
  // すでに 16kHz ならそのまま返す
  if (ab.sampleRate === 16000) {
    return ab.getChannelData(0);
  }
  // OfflineAudioContext で 16kHz にリサンプリング
  const targetRate = 16000;
  const outLen = Math.ceil(ab.length * targetRate / ab.sampleRate);
  const offline = new OfflineAudioContext(1, outLen, targetRate);
  const src = offline.createBufferSource();
  src.buffer = ab;
  src.connect(offline.destination);
  src.start(0);
  const resampled = await offline.startRendering();
  return resampled.getChannelData(0);
}

// Wav2Vec2 + CTC 強制アラインメントで文字ごとの発音スコアを計算
async function assessPronunciation(audioBlob, word) {
  await modelReady;
  const float32 = await blobToFloat32(audioBlob);
  const inputs = await _processor(float32, { sampling_rate: 16000 });
  const { logits } = await _model(inputs); // [1, T, V]

  // wav2vec2-base-960h の固定 vocab（ブラウザ互換性のためハードコード）
  const vocab = {
    '<pad>':0,'<unk>':1,'|':2,'E':3,'T':4,'A':5,'O':6,'N':7,'I':8,'H':9,
    'S':10,'R':11,'D':12,'L':13,'U':14,'M':15,'W':16,'C':17,'F':18,'G':19,
    'Y':20,'P':21,'B':22,'V':23,'K':24,"'":25,'X':26,'J':27,'Q':28,'Z':29
  };
  const blankId = 0;

  const targetIds = [];
  for (const c of word.toUpperCase()) {
    if (c !== ' ' && vocab[c] !== undefined) targetIds.push(vocab[c]);
  }
  if (targetIds.length === 0) {
    const chars = [...word].filter(c => c !== ' ').map(c => ({ char: c, score: 50 }));
    return { chars, score: 50 };
  }

  const { lps: charLPs, charBestIds } = ctcForcedAlign(logits.data, T, V, targetIds, blankId);

  const idToChar = Object.fromEntries(Object.entries(vocab).map(([k, v]) => [v, k]));
  const chars = [];
  let idx = 0;
  for (const c of word) {
    if (c === ' ') continue;
    const bestId = charBestIds[idx];
    const heard = bestId >= 0 ? (idToChar[bestId] || null) : null;
    chars.push({ char: c, score: lpToScore(charLPs[idx++] ?? -10), heard });
  }
  const score = Math.round(chars.reduce((a, b) => a + b.score, 0) / chars.length);

  return { chars, score };
}

// ===== PRONUNCIATION SCORING =====
// 編集距離ベースで各文字を ok / ng に分類
function scorePronunciation(target, heard) {
  const t = target.toLowerCase().replace(/\s+/g, '');
  const h = heard.toLowerCase().replace(/\s+/g, '');
  if (t === h) {
    return { score: 100, charResults: target.split('').map(c => c === ' ' ? 'space' : 'ok') };
  }
  // Wagner-Fischer DP
  const m = t.length, n = h.length;
  const dp = Array.from({length: m+1}, (_, i) =>
    Array.from({length: n+1}, (_, j) => i === 0 ? j : j === 0 ? i : 0));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = t[i-1] === h[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);

  // traceback → alignment for target chars
  const align = [];
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && t[i-1] === h[j-1]) {
      align.unshift('ok'); i--; j--;
    } else if (i > 0 && j > 0 && dp[i][j] === dp[i-1][j-1] + 1) {
      align.unshift('ng'); i--; j--;        // substitution
    } else if (j > 0 && dp[i][j] === dp[i][j-1] + 1) {
      j--;                                   // insertion in heard (skip)
    } else {
      align.unshift('ng'); i--;              // deletion
    }
  }
  const okCount = align.filter(r => r === 'ok').length;
  const score = Math.round((okCount / m) * 100);
  // spaces are always neutral
  let ci = 0;
  const charResults = target.split('').map(c => c === ' ' ? 'space' : (align[ci++] || 'ng'));
  return { score, charResults };
}

// IPA 発音記号比較パネルを表示（ELSAスタイル：お手本のみ、タップでヒント）
function showIPACompare(word, chars) {
  const el = document.getElementById('ipa-compare');
  const hintBox = document.getElementById('hint-box');
  const ipaChars = WORD_IPA[word];
  const nonSpaceLen = word.replace(/ /g, '').length;

  hintBox.classList.remove('show');

  if (!ipaChars || ipaChars.length !== nonSpaceLen) {
    el.style.display = 'none';
    return;
  }

  // お手本行: IPA をスコアで色付け（タップでヒント）
  const targetCells = ipaChars.map((ipa, i) => {
    const charData = chars[i];
    const cls = !charData ? 'ng'
      : charData.score >= 70 ? 'ok'
      : charData.score >= 50 ? 'partial' : 'ng';
    const charLetter = word.replace(/ /g, '')[i] || '';
    return `<span class="ipa-cell ${cls}" data-ipa="${ipa}" data-char="${charLetter}" data-score="${charData?.score ?? 0}">${ipa ? '/'+ipa+'/' : '・'}</span>`;
  }).join('');

  el.innerHTML = `
    <div class="ipa-row">
      <span class="ipa-label">お手本</span>
      <div class="ipa-cells" id="ipa-cells-target">${targetCells}</div>
    </div>`;
  el.style.display = 'flex';

  // タップ → ヒント表示
  el.querySelectorAll('.ipa-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const ipa = cell.dataset.ipa;
      const ch = cell.dataset.char;
      const hint = IPA_HINTS[ipa];
      if (!hint) return;
      hintBox.textContent = `「${ch}」の音: ${hint}`;
      hintBox.classList.add('show');
    });
  });

  // 最初に弱い音素のヒントを自動表示
  const weakIdx = ipaChars.findIndex((_, i) => (chars[i]?.score ?? 100) < 70);
  if (weakIdx >= 0) {
    const ipa = ipaChars[weakIdx];
    const ch = word.replace(/ /g, '')[weakIdx] || '';
    const hint = IPA_HINTS[ipa];
    if (hint) {
      hintBox.textContent = `「${ch}」の音: ${hint}`;
      hintBox.classList.add('show');
    }
  }
}

// レターボックスを描画（result なければグレー）

    return `<div class="letter-box ${cls}">${c}</div>`;
  }).join('');
}

// iOS: オーディオセッションを事前起動（getUserMedia を高速化）

  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(s => s.getTracks().forEach(t => t.stop()))
    .catch(() => {});
}

function openMicModal() {

function closeMicModal() {
  document.getElementById('mic-modal').classList.remove('open');
  document.getElementById('mic-modal').setAttribute('aria-hidden', 'true');
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.stop(); } catch(e){}
  }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  isListening = false;
  setMicState('idle');
  stopCompareAudio();
  document.getElementById('compare-btns').style.display = 'none';
  document.getElementById('ipa-compare').style.display = 'none';

function setMicState(state) {
  const waveEl   = document.getElementById('mic-waveform');
  const statusEl = document.getElementById('mic-status-text');
  const btnEl    = document.getElementById('mic-round-btn');
  if (state === 'listening') {
    waveEl.classList.add('active');
    statusEl.textContent = '👂 はなしてね...';
    btnEl.classList.add('listening');
    btnEl.innerHTML = '⏹';
  } else {
    waveEl.classList.remove('active');
    statusEl.textContent = state === 'processing'
      ? '⏳ かんがえてるよ...'
      : 'マイクを おして はなしてね 🎙';
    btnEl.classList.remove('listening');
    btnEl.innerHTML = '<svg style="pointer-events:none" viewBox="0 0 24 24" width="38" height="38" fill="currentColor"><path d="M9,5A4,4 0 0,1 13,9A4,4 0 0,1 9,13A4,4 0 0,1 5,9A4,4 0 0,1 9,5M9,15C11.67,15 17,16.34 17,19V21H1V19C1,16.34 6.33,15 9,15M16.76,5.36C18.78,7.56 18.78,10.61 16.76,12.63L15.08,10.94C15.92,9.76 15.92,8.23 15.08,7.05L16.76,5.36M20.07,2C24,6.05 23.97,12.11 20.07,16L18.44,14.37C21.21,11.19 21.21,6.65 18.44,3.63L20.07,2Z"/></svg>';
    statusEl.textContent = 'マイクを おして はなしてね 🎙';
  }
}

async function startMicModal() {
  // iOS: TTSと同時使用不可 → 先にキャンセル
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micStream = stream;

    // ブラウザ対応フォーマットを選択（iOS Safari は audio/mp4）
    const mimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']
      .find(t => MediaRecorder.isTypeSupported(t)) || '';

    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      // ストリームを閉じる
      stream.getTracks().forEach(t => t.stop());
      micStream = null;
      setMicState('processing');

      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      lastAudioBlob = blob;   // 聴き比べ用に保存
      const word = words[index].en;
      try {
        // ブラウザ内 Wav2Vec2 で発音評価（サーバー不要）、15秒タイムアウト付き
        const timeout = new Promise((_, reject) =>
          setTimeout(() => reject(new Error('timeout')), 15000));
        const result = await Promise.race([assessPronunciation(blob, word), timeout]);
        showMicModalResultFromBackend(result, word);
      } catch (err) {
        console.warn('評価エラー:', err);
        const msg = err?.message || String(err);
        showMicModalResult(false, 'きこえなかったよ');
        setTimeout(() => {
          document.getElementById('heard-label').textContent = `エラー: ${msg}`;
        }, 300);
      }
      isListening = false;
      setMicState('idle');
    };

    mediaRecorder.start();
    isListening = true;
    setMicState('listening');

    // 5秒後に自動停止
    setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }, 5000);

  } catch (err) {
    isListening = false;
    setMicState('idle');
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      document.getElementById('mic-status-text').textContent = 'マイクを許可してね ⚠️';
    } else {
      console.error('マイクエラー:', err);
    }
  }
}

function stopMicRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
}

// バックエンドからの発音スコアで文字ボックスを色付け
function showMicModalResultFromBackend(result, word) {
  const { chars, score } = result;
  const ok = score >= 70;
  if (ok) correctCount++;
  micModalLastResult = { ok, heard: word };

  renderLetterBoxes(word, null);
  const boxes = document.querySelectorAll('#letter-boxes .letter-box');
  let bi = 0;
  let charIdx = 0;
  word.split('').forEach((c, i) => {
    if (c === ' ') return;
    const box = boxes[i];
    if (!box) return;
    const charData = chars[charIdx++];
    // スコア閾値: 70以上→ok(緑), 50以上→partial(黄), 未満→ng(赤)
    const cls = !charData ? 'ng'
      : charData.score >= 70 ? 'ok'
      : charData.score >= 50 ? 'partial'
      : 'ng';
    const delay = bi * 110;
    bi++;
    setTimeout(() => { box.classList.add(cls); }, delay);
  });

  const totalDelay = Math.max(0, bi - 1) * 110 + 400;
  setTimeout(() => showScore(score), totalDelay);

  // 結果メッセージ（ヒントはIPAパネルのタップで表示）
  document.getElementById('heard-label').textContent =
    score >= 90 ? '🎉 すばらしい！'
    : score >= 70 ? '👍 いい感じ！'
    : score >= 50 ? '📖 IPAをタップして練習しよう'
    : '🔄 もういちど やってみよう';

  document.getElementById('mic-modal-actions').classList.add('show');

  // IPA 比較パネルを表示
  showIPACompare(word, chars);

  // 聴き比べボタンを表示
  document.getElementById('compare-btns').style.display = 'flex';
  // 再生状態をリセット
  stopCompareAudio();
  document.getElementById('btn-listen-model').classList.remove('playing');
  document.getElementById('btn-listen-me').classList.remove('playing');

  // 95点以上なら自動クローズ
  if (score >= 95) {
    setTimeout(() => {
      if (document.getElementById('mic-modal').classList.contains('open')) closeMicModal();
    }, totalDelay + 1800);
  }
}

function showMicModalResult(ok, heard) {
  micModalLastResult = { ok, heard };
  const target = words[index].en;
  const { score, charResults } = scorePronunciation(target, heard);
  const actionsEl = document.getElementById('mic-modal-actions');

  // レターボックスをスコア別に1文字ずつ遅延で色をつける（ELSAスタイル）
  renderLetterBoxes(target, null); // まずグレーで再描画
  const boxes = document.querySelectorAll('#letter-boxes .letter-box');
  let bi = 0;
  target.split('').forEach((c, i) => {
    if (c === ' ') return;
    const box = boxes[i];
    if (!box) return;
    const delay = bi * 110;
    bi++;
    setTimeout(() => { box.classList.add(charResults[i] || 'ng'); }, delay);
  });

  // スコアは全ボックス開示後に表示
  const totalDelay = (bi - 1) * 110 + 400;
  setTimeout(() => showScore(score), totalDelay);

  document.getElementById('heard-label').textContent =
    heard === 'きこえなかったよ' ? '（きこえなかったよ）'
    : score === 100 ? '🎉 すばらしい！'
    : score >= 70 ? '👍 いい感じ！'
    : '🔄 もういちど やってみよう';

  actionsEl.classList.add('show');

  // 100点なら2.5秒後に自動クローズ
  if (score === 100) {
    setTimeout(() => {
      if (document.getElementById('mic-modal').classList.contains('open')) closeMicModal();
    }, totalDelay + 1800);
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ===== RESULT =====
function showResult() {
  const total = words.length;
  const pct = correctCount / total;
  let emoji = '🌟';
  let stars = '⭐⭐⭐';
  if (pct < 0.4)  { emoji = '😊'; stars = '⭐'; }
  else if (pct < 0.75) { emoji = '🎊'; stars = '⭐⭐'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-stars').textContent = stars;
  document.getElementById('result-score').textContent =
    `はつおんチェック ${correctCount}/${total} もんせいかい！`;
  showScreen('screen-result');
}

// ===== EVENTS =====
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => startQuiz(btn.dataset.cat));
});

document.getElementById('back-btn').addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') { try { mediaRecorder.stop(); } catch(e){} }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  isListening = false;
  window.speechSynthesis && window.speechSynthesis.cancel();
  showScreen('screen-home');
});

document.getElementById('btn-replay').addEventListener('click', () => {
  speak(words[index].en);
});

// はつおんボタン → モーダルを開くだけ（録音はラウンドボタンで開始）
document.getElementById('btn-mic').addEventListener('click', () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  openMicModal();
});

// ===== 聴き比べ =====
function stopCompareAudio() {
  if (_compareAudio) {
    _compareAudio.pause();
    _compareAudio.currentTime = 0;
    _compareAudio = null;
  }
  window.speechSynthesis && window.speechSynthesis.cancel();
}

function setComparePlaying(btnId, playing) {
  ['btn-listen-model', 'btn-listen-me'].forEach(id => {
    document.getElementById(id).classList.toggle('playing', id === btnId && playing);
  });
}

document.getElementById('btn-listen-model').addEventListener('click', () => {
  const btn = document.getElementById('btn-listen-model');
  if (btn.classList.contains('playing')) {
    stopCompareAudio();
    setComparePlaying(null, false);
    return;
  }
  stopCompareAudio();
  setComparePlaying('btn-listen-model', true);
  const word = words[index].en;
  const synth = window.speechSynthesis;
  if (!synth) { setComparePlaying(null, false); return; }
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US'; utter.rate = 0.85; utter.pitch = 1.1;
  const enVoice = synth.getVoices().find(v => v.lang === 'en-US')
    || synth.getVoices().find(v => v.lang.startsWith('en'));
  if (enVoice) utter.voice = enVoice;
  utter.onend = () => setComparePlaying(null, false);
  utter.onerror = () => setComparePlaying(null, false);
  synth.speak(utter);
});

document.getElementById('btn-listen-me').addEventListener('click', () => {
  const btn = document.getElementById('btn-listen-me');
  if (btn.classList.contains('playing')) {
    stopCompareAudio();
    setComparePlaying(null, false);
    return;
  }
  if (!lastAudioBlob) return;
  stopCompareAudio();
  setComparePlaying('btn-listen-me', true);
  const url = URL.createObjectURL(lastAudioBlob);
  _compareAudio = new Audio(url);
  _compareAudio.onended = () => {
    setComparePlaying(null, false);
    URL.revokeObjectURL(url);
    _compareAudio = null;
  };
  _compareAudio.onerror = () => {
    setComparePlaying(null, false);
    URL.revokeObjectURL(url);
    _compareAudio = null;
  };
  _compareAudio.play().catch(() => setComparePlaying(null, false));
});

// モーダル内ボタン
document.getElementById('mic-modal-close').addEventListener('click', closeMicModal);

// ラウンドボタン：タップでON/OFF（5秒後に自動停止）
// ゴーストクリックは openMicModal() の pointer-events:none で防ぐ
document.getElementById('mic-round-btn').addEventListener('click', () => {
  if (isListening) {
    stopMicRecording();
  } else {
    startMicModal();
  }
});

document.getElementById('btn-next').addEventListener('click', nextCard);
document.getElementById('btn-home').addEventListener('click', () => showScreen('screen-home'));

// double-tap zoom prevention is handled via CSS touch-action: manipulation
</script>
